name: Release APK

# Runs when you approve the build (workflow_dispatch) or when a v* tag is pushed.
# Release notes come from update.json so the in-app updater and the GitHub
# release always show the same changelog.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p signing
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > signing/raazi-keystore.jks
          if [ ! -s signing/raazi-keystore.jks ]; then
            echo "::error::Decoded keystore is empty — check KEYSTORE_BASE64"
            exit 1
          fi

      - name: Print keystore SHA-256 fingerprint
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          keytool -list -v -keystore signing/raazi-keystore.jks -storepass "$SIGNING_STORE_PASSWORD" | grep -E "Alias name:|SHA256:" || true

      - name: Read version
        id: version
        run: |
          NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "version=$NAME" >> "$GITHUB_OUTPUT"
          echo "Version: $NAME"

      - name: Build signed release APK
        env:
          SIGNING_STORE_PATH: ${{ github.workspace }}/signing/raazi-keystore.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_STORE_PASSWORD" ]; then
            echo "::error::KEYSTORE_PASSWORD secret is not set"
            exit 1
          fi
          ./gradlew :app:assembleRelease --stacktrace

      - name: Stage APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk \
             release/Raazi-v${{ steps.version.outputs.version }}.apk
          ls -la release/

      - name: Extract release notes
        run: |
          python3 - <<'EOF' > release/NOTES.md
          import json
          with open('update.json', encoding='utf-8') as f:
              print(json.load(f).get('releaseNotes', 'Raazi release'))
          EOF

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Raazi v${{ steps.version.outputs.version }}
          body_path: release/NOTES.md
          files: release/*.apk
          draft: false
          prerelease: false
