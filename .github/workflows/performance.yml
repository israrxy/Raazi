name: Performance APK

# Builds the exact release build type (non-debuggable, R8/minify settings
# identical to release.yml) but signs it with the stable debug key and only
# uploads a workflow artifact - no GitHub release, no tag.
#
# Signing with the debug key means this APK installs straight over an existing
# debug install, so app data (library, downloads, settings) is preserved.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-performance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-home-cache-cleanup: true

      - name: Restore stable debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
            echo "Restored stable debug keystore."
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 is not set; generating a temporary debug keystore."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Read version
        id: version
        run: |
          NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "version=$NAME" >> "$GITHUB_OUTPUT"
          echo "Version: $NAME"

      # No SIGNING_* variables are exported, so the release signing config stays
      # unset and the release build type falls back to the debug key. That keeps
      # the signature identical to the debug APK.
      - name: Build release-type APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Stage APK
        run: |
          mkdir -p perf
          cp app/build/outputs/apk/release/app-release.apk \
             "perf/Raazi-v${{ steps.version.outputs.version }}-perf.apk"
          ls -la perf/

      - name: Verify build type and signature
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "Debuggable flag:"
          "$BUILD_TOOLS/aapt" dump badging "perf/Raazi-v${{ steps.version.outputs.version }}-perf.apk" \
            | grep -E "^package:|application-debuggable" || echo "not debuggable"
          echo "Signer:"
          "$BUILD_TOOLS/apksigner" verify --print-certs \
            "perf/Raazi-v${{ steps.version.outputs.version }}-perf.apk" | head -5

      - name: Upload performance APK
        uses: actions/upload-artifact@v4
        with:
          name: raazi-perf-apk
          path: perf/*.apk
          if-no-files-found: error
